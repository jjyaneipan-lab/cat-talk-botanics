<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Talk Botanics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-label="Cat Talk Botanics writing companion">
    <section class="paper">
      <header class="header">
        <h1>Cat Talk Botanics</h1>
        <p>Choose your companion and build your own garden.</p>
      </header>

      <section class="companion-picker" aria-labelledby="companion-label">
        <h2 id="companion-label">Choose your writing companion</h2>
        <div class="cat-options" role="radiogroup" aria-label="Cat companions">
          <button class="cat-option is-selected" type="button" role="radio" aria-checked="true" data-cat="white">
            white
          </button>
          <button class="cat-option" type="button" role="radio" aria-checked="false" data-cat="black">
            black
          </button>
          <button class="cat-option" type="button" role="radio" aria-checked="false" data-cat="tabby">
            tabby
          </button>
          <button class="cat-option" type="button" role="radio" aria-checked="false" data-cat="orange">
            orange
          </button>
          <button class="cat-option" type="button" role="radio" aria-checked="false" data-cat="tuxedo">
            tuxedo
          </button>
        </div>
      </section>

      <section class="cat-stage cat-white" aria-live="polite">
        <div class="pixel-window" role="img" aria-label="A pixel cat peeking out of a garden window">
          <div class="garden" aria-label="A digital flower garden grown by typing"></div>
          <div class="cat-frame">
            <div class="pixel-cat" aria-hidden="true">
              <span class="px ear-left"></span>
              <span class="px ear-right"></span>
              <span class="px cat-head"></span>
              <span class="stripes"></span>
              <span class="eye-left"></span>
              <span class="eye-right"></span>
              <span class="sleep-eye left"></span>
              <span class="sleep-eye right"></span>
              <span class="concern-mark left"></span>
              <span class="concern-mark right"></span>
              <span class="nose"></span>
              <span class="mouth"></span>
              <span class="yawn-mouth"></span>
              <span class="paws"></span>
            </div>
          </div>
          <span class="typing-pulse" aria-hidden="true"></span>
          <span class="sleep-sign" aria-hidden="true">zzz</span>
        </div>
      </section>

      <section class="workspace" aria-label="Writing and garden notes">
        <div class="workspace-tabs" role="tablist" aria-label="Notebook sections">
          <button class="tab-button is-active" id="write-tab" type="button" role="tab" aria-selected="true" aria-controls="write-panel" data-panel="write">
            write
          </button>
          <button class="tab-button" id="notes-tab" type="button" role="tab" aria-selected="false" aria-controls="notes-panel" data-panel="notes">
            garden notes <span class="note-count">0</span>
          </button>
        </div>

        <section class="tab-panel is-active" id="write-panel" role="tabpanel" aria-labelledby="write-tab">
          <div class="writing-area">
            <p class="status" id="status" aria-live="polite">the white cat is listening politely.</p>
            <label for="writing">Write here</label>
            <textarea id="writing" spellcheck="true" placeholder="Begin with one honest sentence..."></textarea>
          </div>

          <div class="garden-panel" aria-label="Garden controls">
            <p id="companion-detail">Daisy likes quiet sentences and soft yellow centers.</p>
            <button class="clear-button" type="button">clear garden</button>
          </div>
        </section>

        <section class="tab-panel notes-panel" id="notes-panel" role="tabpanel" aria-labelledby="notes-tab" hidden>
          <h2 id="notes-label">garden notes</h2>
          <div class="notes-empty">press Enter while writing to save a note here.</div>
          <div class="notes" aria-live="polite"></div>
        </section>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
